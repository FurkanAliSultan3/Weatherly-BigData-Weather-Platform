name: Deploy React Site to GitHub Pages

on:
  push:
    branches: [ main ] # or master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        # Replace 'SIH_weatherly' with your exact subfolder name if different
        working-directory: ./SIH_weatherly
        run: npm install --legacy-peer-deps

      - name: Build React Vite Project
        # Replace 'SIH_weatherly' with your exact subfolder name if different
        working-directory: ./SIH_weatherly
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Point this to the dist folder inside your subfolder!
          path: './SIH_weatherly/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
